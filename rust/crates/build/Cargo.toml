[package]
name = "lithe-build"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Build systems declared by Lithe plugins: validation, static models, argv plans and normalized output decoding"

[dependencies]
base64 = "0.22"
lithe-debug = { path = "../debug" }
lithe-execution = { path = "../execution" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
lithe-remote = { path = "../remote", default-features = false, features = ["client"] }
lithe-workspace = { path = "../workspace" }
quick-xml = "0.37"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
url = "2.5"
