[package]
name = "lithe-document-uri"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lexical conversions between native filesystem paths and LSP document URIs that both platform hosts share"

[dependencies]
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2.5"
