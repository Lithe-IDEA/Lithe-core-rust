[package]
name = "lithe-terminal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Terminal output link detection, output character decoding and ANSI style decoding shared by every Lithe host"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
