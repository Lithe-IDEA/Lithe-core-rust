[package]
name = "lithe-plugin-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The plugin backend a manifest declares: one long-lived process per plugin, its triggers and the host services it may request"

[dependencies]
lithe-plugin-model = { path = "../plugin-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
