[package]
name = "lithe-project-generators"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Project generators declared by Lithe plugins: declarations, the New Project form, generation plans and archive extraction"

[dependencies]
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.8"
