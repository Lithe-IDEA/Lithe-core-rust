[package]
name = "lithe-toolchain"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Plugin-owned toolchain policy for Lithe: tool definitions, directory pins, consumer preferences, resolution and version checks"

[dependencies]
ignore = "=0.4.33"
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
