[package]
name = "lithe-remote"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Protocol, client transports and host server for Lithe remote workspaces"
publish = false
autotests = false

[features]
default = ["client"]
client = ["dep:sha2"]
# Reads Motty's SQLite configuration database for an import. SQLite is
# bundled because Windows has no system library; only the desktop Core turns
# it on, never the host server.
motty = ["client", "dep:rusqlite"]
# Host adapters must not become desktop client dependencies. Linux releases
# target musl so the same static executable works in minimal containers.
server = ["dep:flate2", "dep:tar", "dep:zip", "dep:libc", "dep:lithe-core-rules", "dep:lithe-platform", "dep:lithe-text", "dep:lithe-vcs", "dep:sha2", "dep:trash"]

# The server runs on Linux and macOS hosts, and its integration tests start
# the server binary of this package, so they cannot move to
# lithe-platform-tests. CI runs them with the server feature on Linux and on
# macOS (scripts/rust-core/affected-crates.mjs).
[package.metadata.lithe-ci]
hosts = ["macos"]
test-features = ["server", "motty"]

[dependencies]
flate2 = { version = "1", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
libc = { version = "0.2", optional = true }
trash = { version = "5.2.6", default-features = false, features = ["chrono"], optional = true }
# The server checks socket peers with the same code as the AskPass channel.
# lithe-platform is a leaf crate of host rules that depends only on libc.
lithe-platform = { path = "../platform", optional = true }
# Only the server compiles the shared disk search policies.
lithe-core-rules = { path = "../core-rules", optional = true }
lithe-text = { path = "../text", optional = true }
lithe-vcs = { path = "../vcs", optional = true }

# Tests check every lifecycle fact against the log catalog Core validates with.
# The client does not link the server's workspace rules.
[dev-dependencies]
lithe-diagnostics = { path = "../diagnostics" }

[[bin]]
name = "lithe-remote-server"
path = "src/bin/lithe-remote-server.rs"
required-features = ["server"]

[[test]]
name = "server"
required-features = ["client", "server"]

[[test]]
name = "processes"
required-features = ["client", "server"]

[[test]]
name = "watch_and_walk"
required-features = ["client", "server"]

[[test]]
name = "terminals"
required-features = ["client", "server"]

[[test]]
name = "run_directories"
required-features = ["client", "server"]

[[test]]
name = "tunnels"
required-features = ["client", "server"]

[[test]]
name = "persistence"
required-features = ["client", "server"]

[[test]]
name = "connection_log"
required-features = ["client", "server"]

[[test]]
name = "native_settings"
required-features = ["client", "server"]
