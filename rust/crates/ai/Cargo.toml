[package]
name = "lithe-ai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Credential-free AI request planning and response decoding for Lithe Core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order matches lithe-core: planned request bodies keep their field order.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
url = "2.5"
