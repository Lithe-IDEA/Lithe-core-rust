[package]
name = "lithe-row-selection"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The multi-selection of rows of workspace paths: the selected row, the rows marked for a batch and the row a Shift click extends from"

[dependencies]
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
