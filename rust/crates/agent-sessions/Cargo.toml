[package]
name = "lithe-agent-sessions"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cache of the model calls, token counts and search index Lithe derives from the session files agent CLIs keep on this machine"
publish = false

[dependencies]
globset = "0.4"
lithe-protocol = { path = "../protocol" }
# SQLite is bundled because Windows has no system library, and the cache needs
# FTS5 with contentless deletes (SQLite 3.43 or later).
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2"
