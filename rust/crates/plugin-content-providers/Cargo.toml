[package]
name = "lithe-plugin-content-providers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Read-only documents a plugin backend serves as a URI scheme, and the checks on each answer"

[dependencies]
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
