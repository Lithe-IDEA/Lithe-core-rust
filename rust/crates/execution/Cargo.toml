[package]
name = "lithe-execution"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Run configurations for Lithe: generation, resolution, launch planning and environments"

[features]
# Lets lithe-core's tests seed the generated layer as if a host had generated it.
test-support = []

[dependencies]
ignore = "=0.4.33"
lithe-core-rules = { path = "../core-rules" }
lithe-platform = { path = "../platform" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
lithe-toolchain = { path = "../toolchain" }
lithe-workspace = { path = "../workspace" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

