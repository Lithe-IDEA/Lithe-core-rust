[package]
name = "lithe-execution"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Run configurations for Lithe: generation, resolution, launch environments and project run discovery"

[features]
# Lets lithe-core's tests seed the generated layer as if a host had generated it.
test-support = []

[dependencies]
lithe-diagnostics = { path = "../diagnostics" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
lithe-toolchain = { path = "../toolchain" }
lithe-workspace = { path = "../workspace" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }

