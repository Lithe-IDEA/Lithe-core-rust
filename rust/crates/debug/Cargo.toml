[package]
name = "lithe-debug"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Debug Adapter Protocol sessions for Lithe: adapter declarations, transport lifecycle and normalized debugger models"

[dependencies]
base64 = "0.22"
lithe-diagnostics = { path = "../diagnostics" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
