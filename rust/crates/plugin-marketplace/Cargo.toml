[package]
name = "lithe-plugin-marketplace"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Plugin marketplace indexes: validation, platform and plugin API filtering, source URL resolution and install reviews"

[dependencies]
lithe-plugin-manifest = { path = "../plugin-manifest" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2.5"
