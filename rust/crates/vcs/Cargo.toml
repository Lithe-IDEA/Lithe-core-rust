[package]
name = "lithe-vcs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The unified VCS model for Lithe: provider declarations, root detection, request planning and reply validation"

[dependencies]
lithe-plugin-model = { path = "../plugin-model" }
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
