[package]
name = "lithe-request-context"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "State scoped to one Core request: its provenance and trace correlation, and the ordered, redacted event channel to the host"

[dependencies]
lithe-diagnostics = { path = "../diagnostics" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
