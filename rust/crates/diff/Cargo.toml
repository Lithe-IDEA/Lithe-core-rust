[package]
name = "lithe-diff"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Line comparison and removed/added line pairing for every Lithe diff view"

[dependencies]
lithe-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "3.2", default-features = false, features = ["std"] }
