[package]
name = "lithe-editor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic editor commands: line edits and comment tokens, find, text edit plans, navigation input and history, preferences, recent files and recovery decisions"

[dependencies]
lithe-protocol = { path = "../protocol" }
lithe-text = { path = "../text" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
