[package]
name = "lithe-plugin-manifest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Declarative plugin manifests: validation, normalization and the run, test, debug, settings and language-server plans derived from them"

[dependencies]
lithe-build = { path = "../build" }
lithe-debug = { path = "../debug" }
lithe-plugin-backend = { path = "../plugin-backend" }
lithe-plugin-functions = { path = "../plugin-functions" }
lithe-plugin-grammar = { path = "../plugin-grammar" }
lithe-plugin-keymap-import = { path = "../plugin-keymap-import" }
lithe-plugin-language-servers = { path = "../plugin-language-servers" }
lithe-plugin-model = { path = "../plugin-model" }
lithe-plugin-native-ui = { path = "../plugin-native-ui" }
lithe-plugin-output-links = { path = "../plugin-output-links" }
lithe-plugin-rpc = { path = "../plugin-rpc" }
lithe-project-generators = { path = "../project-generators" }
lithe-protocol = { path = "../protocol" }
lithe-toolchain = { path = "../toolchain" }
lithe-vcs = { path = "../vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
