[package]
name = "lithe-plugin-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared vocabulary of declarative Lithe plugin manifests: rejections, identifiers, versions, templates, icons, executables, settings and the processes a plugin declares"

[dependencies]
lithe-protocol = { path = "../protocol" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
